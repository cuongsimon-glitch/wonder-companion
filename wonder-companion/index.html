<title>Wonder Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a painted story stage on top, a reading panel beneath it, like a picture book page on a tablet. */
:root {
  --paper: #f4f6f1;
  --card: #ffffff;
  --ink: #26314f;
  --ink-soft: #5b6585;
  --line: #dde2d8;
  --saffron: #f2a93b;
  --saffron-deep: #b86d0e;
  --teal: #2f8c88;
  --teal-soft: #dcefec;
  --teal-btn: #25706c; --teal-btn-deep: #1a524f; --on-teal: #ffffff; --teal-text: #20706c; --need-ink: #8f4f05;
  --rose: #d9576b;
  --rose-soft: #fbe3e6;
  --gold-soft: #fdf1d6;
  --chip: rgba(255,255,255,.88);
  --chip-ink: #26314f;
  --chip-heart: #d9576b;
  --chip-seg: #8a5cc2;
  --chip-seg-off: #e4e1ee;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171c2e; --card: #212842; --ink: #eef0f7; --ink-soft: #a9b0cc; --line: #343c5c;
    --saffron: #f5b453; --saffron-deep: #f5b453; --teal: #6cc7c0; --teal-soft: #1f3b44;
    --teal-btn: #6cc7c0; --teal-btn-deep: #3f918b; --on-teal: #0f2a28; --teal-text: #6cc7c0; --need-ink: #f5b453;
    --rose: #f08a99; --rose-soft: #43283a; --gold-soft: #3a3324; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171c2e; --card: #212842; --ink: #eef0f7; --ink-soft: #a9b0cc; --line: #343c5c;
  --saffron: #f5b453; --saffron-deep: #f5b453; --teal: #6cc7c0; --teal-soft: #1f3b44;
  --teal-btn: #6cc7c0; --teal-btn-deep: #3f918b; --on-teal: #0f2a28; --teal-text: #6cc7c0; --need-ink: #f5b453;
  --rose: #f08a99; --rose-soft: #43283a; --gold-soft: #3a3324; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.brand small { font-family: var(--body); font-weight: 400; font-size: .8rem; color: var(--ink-soft); }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.steps li { font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; color: var(--ink-soft); border: 1px solid var(--line); }
.steps li.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.steps li.done { color: var(--teal); border-color: var(--teal); }

.stage { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; container-type: inline-size; background: #e9efe7; box-shadow: 0 1px 0 var(--line), 0 12px 30px -18px rgba(20,30,60,.45); }
.stage svg { display: block; width: 100%; height: 100%; }
.stage .title-tag { position: absolute; left: 14px; top: 12px; font-family: var(--display); font-weight: 600; font-size: clamp(.8rem, 2vw, 1rem); background: var(--chip); color: var(--chip-ink); padding: 4px 12px; border-radius: 99px; max-width: calc(55% - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud { position: absolute; left: 14px; top: 46px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 60%; pointer-events: none; }
.hud .pill { display: flex; align-items: center; gap: 3px; background: var(--chip); color: var(--chip-ink); border-radius: 99px; padding: 3px 9px; min-height: 28px; }
.hud .heart { width: 20px; height: 20px; display: block; color: var(--chip-heart); }
.hud .hw { display: inline-block; line-height: 0; }
.hud .hw.lost .heart { color: #c9c4d4; }
.hud .it { display: inline-block; line-height: 0; }
.hud .it svg { width: 22px; height: 22px; display: block; }
.hud .empty { font-size: .72rem; color: #5b6585; }
.meter { position: absolute; right: 14px; top: 12px; background: var(--chip); color: var(--chip-ink); border-radius: 12px; padding: 6px 10px; font-size: .72rem; width: min(220px, 45%); pointer-events: none; }
.meter b { display: block; font-family: var(--display); font-weight: 600; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter .segs { display: flex; gap: 4px; margin-top: 4px; }
.meter .segs i { flex: 1; height: 8px; border-radius: 99px; background: var(--chip-seg-off); transition: background .5s ease; }
.meter .segs i.on { background: var(--chip-seg); }
.caption { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 62%; text-align: center; font-family: var(--display); font-weight: 600; font-size: clamp(.75rem, 2.1cqw, 1rem); line-height: 1.25; background: var(--chip); color: var(--chip-ink); padding: 5px 14px; border-radius: 99px; pointer-events: none; }
.skip { position: absolute; right: 12px; bottom: 10px; z-index: 3; font-family: var(--display); font-weight: 600; font-size: .9rem; padding: 5px 14px; border-radius: 99px; background: var(--chip); color: var(--chip-ink); box-shadow: inset 0 0 0 2px var(--chip-ink); }
.bits { position: absolute; inset: 0; pointer-events: none; }
.bit { position: absolute; top: 33%; width: 46%; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; font-family: var(--display); font-weight: 600; font-size: clamp(.62rem, 1.9cqw, .92rem); line-height: 1.2; color: var(--chip-ink); }
.bit.s0 { left: 3%; } .bit.s1 { left: 51%; }
.bubble, .tag { background: #fff; color: #26314f; border-radius: 14px; padding: 5px 11px; box-shadow: 0 2px 0 rgba(38,49,79,.25); animation: rise .4s ease; overflow-wrap: anywhere; }
.bubble { border: 2px solid #26314f; }
.tag { border: 2px dashed #b9a47a; background: #fffaf0; flex: 1 1 40%; min-width: 0; }
.tag.right { border: 2px solid #2f8c88; background: #e7f6f3; }
.tag small { display: block; font-weight: 700; opacity: .7; }
.tag.seq { flex: 0 1 auto; text-align: center; }
.sound span { display: inline-block; animation: wave .6s ease-in-out infinite; }
.sound { font-size: 1.25em; letter-spacing: .04em; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 3.5vw, 30px); display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 4.2vw, 2.3rem); }
h2 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
p { margin: 0; max-width: 65ch; }
.lead { color: var(--ink-soft); }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-text); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ask-box { display: flex; gap: 10px; align-items: stretch; }
.ask-box textarea, textarea { flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; resize: vertical; min-height: 64px; }
textarea:focus, input:focus { outline: none; border-color: var(--teal); }
button { font: inherit; cursor: pointer; border: none; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.btn { font-family: var(--display); font-weight: 600; font-size: 1.05rem; padding: 12px 22px; border-radius: 99px; background: var(--saffron); color: #2a1d05; box-shadow: 0 3px 0 var(--saffron-deep); transition: transform .1s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--saffron-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.teal { background: var(--teal-btn); color: var(--on-teal); box-shadow: 0 3px 0 var(--teal-btn-deep); }
.icon-btn { flex: none; width: 56px; border-radius: 16px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
.icon-btn.live { background: var(--rose); color: #fff; animation: pulse 1.2s infinite; }
.icon-btn svg { width: 24px; height: 24px; }
.link { background: none; color: var(--teal-text); text-decoration: underline; text-underline-offset: 3px; padding: 0; font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--paper); border: 1px solid var(--line); color: var(--ink); border-radius: 99px; padding: 7px 14px; font-size: .92rem; }
.chip.home { background: var(--gold-soft); border-color: transparent; }
.chip.home::before { content: "From home · "; color: var(--ink-soft); font-size: .8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { background: none; color: var(--ink-soft); padding: 6px 14px; border-radius: 99px; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.label { font-size: .85rem; color: var(--ink-soft); }

.narration { font-size: clamp(1.1rem, 2.4vw, 1.3rem); line-height: 1.6; }
.obstacle { display: flex; gap: 10px; align-items: baseline; background: var(--rose-soft); border-radius: 14px; padding: 10px 14px; }
.obstacle b, .clue b { font-family: var(--display); font-weight: 600; flex: none; }
.clue { display: flex; gap: 10px; align-items: baseline; background: var(--gold-soft); border-radius: 14px; padding: 12px 14px; animation: rise .5s ease; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 1.05rem; display: flex; gap: 12px; align-items: center; }
.choice:hover:not(:disabled) { border-color: var(--teal); }
.choice:disabled { opacity: .6; cursor: default; }
.choice.locked:disabled { opacity: 1; color: var(--ink-soft); border-style: dashed; }
.choice.chosen { border-color: var(--teal); background: var(--teal-soft); opacity: 1; }
.choice .ctext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.choice .need { font-size: .85rem; color: var(--need-ink); font-weight: 700; }
.choice .need.ok { color: var(--teal-text); }
.cluegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.cluecard { min-width: 0; background: var(--paper); border: 2px dashed var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.cluecard[data-state="found"] { background: var(--gold-soft); border: 2px solid transparent; }
.cluecard .kindtag { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-text); font-weight: 700; }
.cluecard .cardbody { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.cluecard .cardfact { display: flex; gap: 10px; align-items: baseline; animation: rise .5s ease; }
.cluecard .cardfact b { font-family: var(--display); font-weight: 600; flex: none; }
.btn.small { font-size: .95rem; padding: 8px 18px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 9px 14px; font-size: 1rem; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt:disabled { opacity: .7; cursor: default; }
.opt.picked { border-color: var(--teal); background: var(--teal-soft); opacity: 1; }
.seqrow { display: flex; flex-wrap: wrap; gap: 6px; }
.seqrow span { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; }
.said { font-style: italic; color: var(--ink-soft); }
.bridge { border-left: 4px solid var(--saffron); padding: 2px 0 2px 12px; font-style: italic; color: var(--ink-soft); }
.clue.consequence { background: var(--teal-soft); }
.pathlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; list-style: disc; }
ol.pathlist { list-style: decimal; }
.choice .k { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-family: var(--display); font-weight: 600; }
.result { border-radius: 16px; padding: 14px 16px; animation: rise .4s ease; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.result { background: var(--gold-soft); }
.result[data-quality="wise"] { background: var(--teal-soft); }
.result .row { margin-top: 2px; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.check-grid > div { min-width: 0; background: var(--paper); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.check-grid ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.check-grid label { display: flex; gap: 8px; align-items: flex-start; }
.check-grid input { margin-top: 5px; accent-color: var(--teal); }
.warn { background: var(--rose-soft); border-radius: 14px; padding: 12px 14px; }
.note-card { background: var(--paper); border: 2px dashed var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.note-card dl { margin: 0; display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 8px 16px; }
.note-card dt { color: var(--ink-soft); font-size: .88rem; }
.note-card dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .note-card dl { grid-template-columns: 1fr; } .note-card dd { margin-bottom: 6px; } }
.status { color: var(--ink-soft); font-size: .92rem; min-height: 1.4em; }
.loading-dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
.foot { color: var(--ink-soft); font-size: .82rem; text-align: center; }

/* Stage animation */
#pipAct, #vilAct, #obstIn { transform-origin: 0 0; }
#obstRoll { transform-origin: 0 -40px; }
.bob { animation: bob 2.6s ease-in-out infinite; }
.blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
.glow { animation: glow 2s ease-in-out infinite; }
.sway { animation: sway 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
.sparkle { animation: sparkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.hop { animation: hop .6s ease; }
.shake { animation: shake .5s ease 2; }
.cheer { animation: cheer .7s ease 2; }
.fade-out { transition: opacity 1s ease, transform 1s ease; opacity: 0; transform: translateY(20px); }
.petal { animation: fall 3.5s linear infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes glow { 50% { opacity: .15; } }
@keyframes sway { 50% { transform: rotate(-3deg) translateY(-4px); } }
@keyframes sparkle { 50% { transform: scale(1.35) rotate(20deg); } }
@keyframes hop { 40% { transform: translateY(-26px); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes cheer { 50% { transform: translateY(-18px) rotate(-6deg); } }
@keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(480px) rotate(200deg); } }
@keyframes wave { 50% { transform: translateY(-7px) scale(1.15); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes pulse { 50% { opacity: .7; } }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@container (max-width: 520px) {
  .bit { top: 40%; }
  .tag { font-size: .58rem; padding: 2px 6px; }
  .hud .empty { font-size: .62rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header>
    <div class="brand">Wonder Companion <small>Prototype</small></div>
    <ol class="steps" id="steps" aria-label="Progress">
      <li data-s="ask">Ask</li><li data-s="check">Teacher check</li><li data-s="play">Adventure</li><li data-s="reflect">Reflect</li><li data-s="note">Family note</li>
    </ol>
  </header>

  <div class="stage" id="stage" aria-hidden="false">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="Story scene"></svg>
    <div class="bits" id="bits"></div>
    <div class="title-tag" id="titleTag">The Wonder Garden</div>
    <div class="hud" id="hud" hidden>
      <div class="pill" id="hearts" data-hearts="3" role="img" aria-label="Pip's hearts: 3 of 3"></div>
      <div class="pill" id="pack" role="img" aria-label="Backpack: empty"></div>
    </div>
    <div class="meter" id="meter" data-power="3" hidden><b id="meterName">Mischief</b><div class="segs" id="meterSegs"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="caption" id="caption" hidden></div>
    <button class="skip" id="skip" type="button" hidden>Skip</button>
  </div>

  <main class="panel" id="panel" aria-live="polite"></main>
  <p class="foot">Pip never gives the answer. Every chapter hides true clues, every choice changes the story, and the child pieces the answer together.</p>
</div>

<script>
(() => {

const SETTINGS = {

function props(key, r) {
  let s = "";
  const rr = (a, b) => a + r() * (b - a);
  switch (key) {
    case "garden":
      s += `<circle cx="680" cy="80" r="38" fill="#ffe59a" opacity=".9"/>`;
      for (let x = 20; x < 800; x += 38) s += `<rect x="${x}" y="300" width="16" height="70" rx="6" fill="#f3e3c7" opacity=".9"/>`;
      s += `<rect x="0" y="318" width="800" height="9" fill="#e9d6b4"/>`;
      for (let i = 0; i < 14; i++) { const x = rr(10, 790), y = rr(380, 440), c = ["#f28fa0", "#ffd166", "#b49be8", "#ffffff"][i % 4];
        s += `<path d="M${x} ${y} q-4 -24 0 -36" stroke="#4f8a46" stroke-width="3" fill="none"/>`;
        for (let k = 0; k < 5; k++) { const a = k * 72 * Math.PI / 180; s += `<circle cx="${(x + Math.cos(a) * 7).toFixed(1)}" cy="${(y - 38 + Math.sin(a) * 7).toFixed(1)}" r="6" fill="${c}" opacity=".85"/>`; }
        s += `<circle cx="${x}" cy="${y - 38}" r="4" fill="#f2a93b"/>`; }
      break;
    case "forest":
      for (let i = 0; i < 8; i++) { const x = rr(0, 800), h = rr(150, 230), y = 360;
        s += `<rect x="${x - 9}" y="${y - h}" width="18" height="${h}" rx="6" fill="#7a5a3c"/>`;
        for (let k = 0; k < 3; k++) s += `<circle cx="${x + rr(-40, 40)}" cy="${y - h + rr(-20, 30)}" r="${rr(40, 62)}" fill="${["#3f7d5c", "#5c9a6a", "#4b8a60"][k]}" opacity=".82"/>`; }
      for (let i = 0; i < 6; i++) s += `<ellipse cx="${rr(0, 800)}" cy="${rr(395, 440)}" rx="${rr(20, 40)}" ry="12" fill="#4b7f45" opacity=".8"/>`;
      break;
    case "cave":
      for (let x = 0; x < 820; x += rr(40, 70)) s += `<path d="M${x} 0 L${x + 22} ${rr(60, 150)} L${x + 44} 0Z" fill="#2e2850" opacity=".9"/>`;
      for (let i = 0; i < 7; i++) { const x = rr(20, 780), y = rr(370, 430), h = rr(24, 50), c = ["#7fe0d3", "#c59bf2", "#9fd2ff"][i % 3];
        s += `<path d="M${x} ${y} l10 -${h} l10 ${h}Z" fill="${c}" opacity=".85"/><circle cx="${x + 10}" cy="${y - h / 2}" r="${h * .7}" fill="${c}" opacity=".12"/>`; }
      break;
    case "ocean":
      s += `<circle cx="160" cy="100" r="46" fill="#ffd27f" opacity=".95"/>`;
      for (let k = 0; k < 4; k++) { let d = `M0 ${250 + k * 22}`; for (let x = 0; x <= 800; x += 40) d += ` q20 -10 40 0`; s += `<path d="${d}" stroke="#ffffff" stroke-width="4" fill="none" opacity="${.7 - k * .12}"/>`; }
      for (let i = 0; i < 6; i++) s += `<ellipse cx="${rr(0, 800)}" cy="${rr(400, 440)}" rx="${rr(6, 12)}" ry="5" fill="#f6b9a6" opacity=".9"/>`;
      break;
    case "sky":
      for (let i = 0; i < 6; i++) { const x = rr(0, 800), y = rr(40, 230); for (let k = 0; k < 4; k++) s += `<circle cx="${x + k * 26}" cy="${y + (k % 2) * 8}" r="${rr(20, 32)}" fill="#ffffff" opacity=".85"/>`; }
      s += `<path d="M600 160 q30 -60 60 0 q-30 34 -60 0Z" fill="#f28fa0"/><path d="M630 178 v40" stroke="#7a5a3c" stroke-width="2"/><rect x="620" y="216" width="20" height="14" rx="3" fill="#c58b55"/>`;
      break;
    case "city":
      for (let i = 0; i < 12; i++) { const x = i * 70 + rr(-10, 10), w = rr(50, 66), h = rr(110, 240), c = ["#8b7ba9", "#9e8eb9", "#b38fa6", "#7f8fb0"][i % 4];
        s += `<rect x="${x}" y="${380 - h}" width="${w}" height="${h}" rx="6" fill="${c}" opacity=".9"/>`;
        for (let wy = 380 - h + 16; wy < 360; wy += 28) for (let wx = x + 10; wx < x + w - 14; wx += 18) if (r() > .35) s += `<rect x="${wx}" y="${wy}" width="9" height="12" rx="2" fill="#ffe7a6" opacity=".9"/>`; }
      break;
    case "space":
      for (let i = 0; i < 80; i++) s += `<circle cx="${rr(0, 800)}" cy="${rr(0, 300)}" r="${rr(.6, 2.2)}" fill="#ffffff" opacity="${rr(.4, 1)}"/>`;
      s += `<circle cx="620" cy="110" r="52" fill="#f28f6b" opacity=".92"/><ellipse cx="620" cy="110" rx="92" ry="18" fill="none" stroke="#ffd27f" stroke-width="6" opacity=".85"/>`;
      for (let i = 0; i < 6; i++) s += `<ellipse cx="${rr(0, 800)}" cy="${rr(390, 430)}" rx="${rr(18, 40)}" ry="7" fill="#6f6898" opacity=".8"/>`;
      break;
    case "mountain":
      for (let i = 0; i < 5; i++) { const x = i * 190 + rr(-40, 40), h = rr(160, 260), w = rr(130, 180);
        s += `<path d="M${x - w} 360 L${x} ${360 - h} L${x + w} 360Z" fill="${["#7c91b2", "#8ea0bd", "#6d83a5"][i % 3]}" opacity=".9"/>`;
        s += `<path d="M${x - w * .28} ${360 - h * .72} L${x} ${360 - h} L${x + w * .28} ${360 - h * .72} l-18 12 l-16 -10 l-14 12Z" fill="#ffffff" opacity=".95"/>`; }
      break;
    case "workshop":
      for (let y = 70; y < 300; y += 80) { s += `<rect x="30" y="${y}" width="250" height="10" rx="3" fill="#7a5638"/>`;
        for (let k = 0; k < 4; k++) s += `<rect x="${44 + k * 58}" y="${y - rr(26, 44)}" width="${rr(24, 40)}" height="${rr(26, 44)}" rx="5" fill="${["#e07a5f", "#81b29a", "#f2cc8f", "#6d97c9"][k]}" opacity=".9"/>`; }
      for (let i = 0; i < 3; i++) { const cx = 560 + i * 80, cy = 120 + (i % 2) * 70, rad = 34 - i * 6;
        s += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#c8913f" stroke-width="14" stroke-dasharray="7 6"/><circle cx="${cx}" cy="${cy}" r="${rad - 6}" fill="#e2b56a"/><circle cx="${cx}" cy="${cy}" r="8" fill="#8a6646"/>`; }
      break;
  }
  return s;
}

function world(key, night) {
  const S = SETTINGS[key] || SETTINGS.garden, r = rng(key);
  let s = `<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.sky[0]}"/><stop offset="1" stop-color="${S.sky[1]}"/></linearGradient></defs>`;
  s += `<rect width="800" height="450" fill="url(#skyg)"/>`;
  s += `<g filter="url(#wc)">`;
  s += hill(250, 24, r() * 6, S.far, .9);
  if (key !== "sky") s += props(key, r);
  s += hill(330, 18, r() * 6, S.near, .85);
  s += hill(372, 10, r() * 6, S.ground, 1);
  if (key === "sky") s += props(key, r);
  s += `</g>`;
  if (night) s += `<rect width="800" height="450" fill="#1a2150" opacity=".42"/><circle cx="700" cy="70" r="30" fill="#fff6d6" opacity=".95" filter="url(#wcs)"/>`;
  return s;
}

  const eyes = (y, sp = 12) => `<g class="blink"><ellipse cx="${-sp}" cy="${y}" rx="6" ry="8" fill="#fff"/><ellipse cx="${sp}" cy="${y}" rx="6" ry="8" fill="#fff"/><circle cx="${-sp + 2}" cy="${y + 1}" r="3.4" fill="#1d2140"/><circle cx="${sp - 2}" cy="${y + 1}" r="3.4" fill="#1d2140"/></g><path d="M${-sp - 8} ${y - 12} l12 5 M${sp + 8} ${y - 12} l-12 5" stroke="#1d2140" stroke-width="3" stroke-linecap="round"/>`;
  const grin = (y) => `<path d="M-14 ${y} Q0 ${y + 12} 14 ${y}" stroke="#1d2140" stroke-width="3" fill="#fff" stroke-linecap="round"/>`;

        <ellipse cx="-9" cy="-112" rx="5" ry="4" fill="#ffe27a"/><ellipse cx="9" cy="-112" rx="5" ry="4" fill="#ffe27a"/>
        <path d="M-40 -60 q-20 10 -16 30 M40 -60 q20 10 16 30" stroke="${c}" stroke-width="12" stroke-linecap="round" fill="none"/>`;

      body = `<rect x="-20" y="-22" width="12" height="22" rx="5" fill="#3b2f55"/><rect x="8" y="-22" width="12" height="22" rx="5" fill="#3b2f55"/>

/* ---------- stage: scene, positions, step player ---------- */
const svg = $("#scene"), NS = "http://www.w3.org/2000/svg";
const STAGE_DEFAULT = { setting: "garden", night: false, pipX: 220, vilX: 670, villain: null, power: 3, obstacle: false, friendly: false, petals: false, title: null };
let stageState = { ...STAGE_DEFAULT };
const pos = { pip: { x: 220, y: 400 }, vil: { x: 670, y: 398, s: 1 }, obst: { x: 400, s: 1, alive: false } };
let gen = 0; /* bumps on every repaint, so a late step can't touch a new scene */
const vilBase = (p) => .6 + p * .12;
const tfPip = () => `translate(${pos.pip.x}px, ${pos.pip.y}px)`;
const tfVil = () => `translate(${pos.vil.x}px, ${pos.vil.y}px) scale(${pos.vil.s.toFixed(3)})`;
const tfObst = () => `translate(${pos.obst.x}px, 380px)`;

function paint(patch = {}) {
  gen++; P.tok++; P.entrance = null;
  const st = Object.assign(stageState, STAGE_DEFAULT, patch);
  pos.pip = { x: st.pipX, y: 400 };
  pos.vil = { x: st.vilX, y: 398, s: st.friendly ? .55 : vilBase(st.power) };
  pos.obst = { x: 400, s: 1, alive: !!st.obstacle };
  clearBits();
  let s = DEFS + world(st.setting, st.night);
  if (st.obstacle) s += `<g id="obst" style="transform:${tfObst()}"><g id="obstIn"><g id="obstRoll">${BOULDERS}</g></g></g>`;
  if (st.villain) {
    const col = st.friendly ? "#b9e4d5" : st.villain.color;
    s += `<g id="vil" style="transform:${tfVil()}"><g id="vilAct"><g id="vilInner" filter="url(#wcs)">${villainSVG(st.villain.type, col)}</g></g></g>`;
  }
  s += `<rect id="dark" width="800" height="450" fill="#0b1030" opacity="0" pointer-events="none"/>`;
  s += `<g id="pip" style="transform:${tfPip()}"><g id="pipAct"><g id="pipInner" filter="url(#wcs)">${PIP}</g></g></g>`;
  if (st.petals) { const r = rng("petals"); for (let i = 0; i < 26; i++) s += `<g transform="translate(${(r() * 800).toFixed(0)} 0)"><ellipse class="petal" style="animation-delay:-${(r() * 3.5).toFixed(2)}s" rx="6" ry="3.5" fill="${["#f28fa0", "#ffd166", "#9fd8c0", "#b49be8"][i % 4]}"/></g>`; }

}
function animate(id, cls) {

  n.classList.remove(cls); void n.getBoundingClientRect(); n.classList.add(cls);
}
const clearBits = () => $("#bits").replaceChildren();

/* player core: every step is awaitable.
   #fast = no motion, ~30 ms a step. Reduced motion = no motion either, but each step jumps to its end
   state and holds ~900 ms with its caption, so the story is still told.
   Cancelling: P.tok changes whenever a scene is painted or the player stops. A step that wakes up after
   that point (anim/pause resolve) never continues, so it can't draw into the next scene. */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
const HASHFAST = () => location.hash === "#fast";
const NOMOTION = () => HASHFAST() || REDUCED.matches;
const HOLD_MS = 900;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const P = { tok: 0, skip: false, skipP: new Promise(() => {}), skipRes: null, running: new Set(), active: false, gen: -1, entrance: null, later: [] };
const live = () => P.gen === gen;
function anim(node, frames, ms, opts = {}) {

  P.running.add(a);
  return a.finished.then(() => {}, () => {}).then(() => { P.running.delete(a); return ep === P.tok ? undefined : NEVER; });
}
const pause = (ms) => {

  return Promise.race([sleep(ms), P.skipP]).then(() => (ep === P.tok ? undefined : NEVER));
};
const flushLater = () => P.later.splice(0).forEach((n) => { try { n?.parentNode?.remove(); } catch {} });
function setCaption(t) { const c = $("#caption"); c.textContent = t || ""; c.hidden = !t; }

}
$("#skip").addEventListener("click", skipNow);
function stopPlayer() {
  P.tok++; P.active = false; P.skip = false;
  P.running.forEach((a) => { try { a.finish(); } catch {} });
  flushLater();
  $("#skip").hidden = true; setCaption("");
}

/* SVG helpers */
function fxAt(x, y, markup) {

const kill = (n) => { if (REDUCED.matches && !HASHFAST() && P.active && !P.skip) P.later.push(n); else { try { n?.parentNode?.remove(); } catch {} } };
const T = (x, y, extra = "") => ({ transform: `translate(${x}px, ${y}px)${extra}` });
const iconMark = (id, size = 48) => `<g transform="translate(${-size / 2} ${-size / 2}) scale(${size / 24})">${id && ICON[id] ? ICON[id] : `<g transform="translate(12 12) scale(.9)">${STAR}</g>`}</g>`;
const popIn = (n, ms = 380) => anim(n, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1.25)", opacity: 1, offset: .65 }, { transform: "scale(1)", opacity: 1 }], ms, { easing: "ease-out" });

const headY = () => pos.pip.y - 150;

const starsMark = (n = 3, r = 30) => Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2; return `<g transform="translate(${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r * .5).toFixed(1)}) scale(.7)">${STAR}</g>`; }).join("");

/* movement */
async function glide(who, x, y, ms) {
  const n = $("#" + who, svg), g0 = gen; if (!n) return;
  const p = pos[who];
  const f = (xx, yy) => (who === "vil" ? `translate(${xx}px, ${yy}px) scale(${p.s.toFixed(3)})` : `translate(${xx}px, ${yy}px)`);
  await anim(n, [{ transform: f(p.x, p.y) }, { transform: f(x, y) }], ms);

const hops = (id, ms) => { const n = Math.max(1, Math.round(ms / 300)); return anim($("#" + id, svg), [T(0, 0), T(0, -10), T(0, 0)], ms / n, { iterations: n }); };

const WALK = { left: 90, middle: 300, right: 735 };
function walkX(a) {

  if (a === "villain") return $("#vil", svg) ? Math.max(120, pos.vil.x - 108 * pos.vil.s - 24) : 520;

/* the action vocabulary */
const STEP = {

  async jump() { await anim($("#pipAct", svg), [T(0, 0), T(0, -80), T(0, 0)], 650, { easing: "ease-out" }); },
  async climb() {

  async slip() {

    const drips = fxAt(x, y - 60, `<g fill="#7fb8e6" stroke="#4a8fc4" stroke-width="1.5"><path d="M-22 -10 q4 8 0 12 q-4 -4 0 -12Z"/><path d="M0 0 q4 8 0 12 q-4 -4 0 -12Z"/><path d="M22 -14 q4 8 0 12 q-4 -4 0 -12Z"/></g>`);

    await anim($("#pipAct", svg), [{ transform: "rotate(0deg)" }, { transform: "rotate(-9deg)" }, { transform: "rotate(9deg)" }, { transform: "rotate(-9deg)" }, { transform: "rotate(9deg)" }, { transform: "rotate(0deg)" }], 1500);

  },
  async run_away() { await Promise.all([glide("pip", -120, 400, 650), hops("pipAct", 650)]); await pause(350); await Promise.all([glide("pip", 90, 400, 700), hops("pipAct", 700)]); },
  async push() {

const FORMS = ["Quest", "Mystery", "Comic caper", "Fable", "Rescue mission", "Race against time", "Detective case", "Tall tale"];
const KINDS = ["spot", "listen", "compare", "ask", "test", "pattern"];
const BEATS = ["ki", "sho", "ten", "ketsu"];
const HELPER_IDS = ["owl", "snail", "mouse", "robot"];
const QUALITIES = ["wise", "risky", "silly"];
const DEFAULT_EFFECTS = { wise: { villain: -1, hearts: 0 }, risky: { villain: 0, hearts: 0 }, silly: { villain: 1, hearts: -1 } };
const DEFAULT_ACTS = { wise: ["walk:obstacle", "think", "cheer"], risky: ["walk:obstacle", "splash", "villain_laugh"], silly: ["walk:obstacle", "slip", "villain_laugh"] };
const DEFAULT_END = {
  triumph: { title: "Pip did it!", narration: "The villain is out of tricks, and Pip's lantern glows bright. Pip noticed so many things along the way.", acts: ["cheer", "rainbow", "confetti"] },
  muddle: { title: "A scrape and a laugh", narration: "Pip gets there in the end, a little muddy and a little puzzled. There is still something left to wonder about.", acts: ["walk:middle", "slip", "cheer"] },
  second_try: { title: "Let's look again tomorrow", narration: "Today the villain's tricks won, but Pip isn't cross. Pip knows what to try next, and tomorrow Pip will look again.", acts: ["think", "dark", "light"] }
};
function buildPrompt(q, age, form) {
  return `You are the story engine for Wonder School's learning companion. A child aged ${age} asked this question:
"""${q}"""

Write an interactive adventure starring Pip, a small, brave, funny explorer with a leaf-sprout head, a saffron raincoat and a lantern. Pip faces a mischievous villain and obstacles. Story form: ${form}. The page ACTS OUT every choice as an animation, so each choice needs a list of action steps. Choices change a few tracked numbers (the villain's power, Pip's hearts, the backpack), and every chapter continues to the next whatever the child chose.

RULES
- NEVER answer the child's question directly anywhere. Each chapter hides true clues, which are accurate facts that are pieces of the answer, phrased as something Pip sees, hears, tests or is told. Together they let the child work out the answer. The villain may lie or mislead, but every clue and every "reveals" line is a true fact.
- The villain embodies a misconception, a trick or the problem in the question. Silly and cheeky, never frightening or cruel. No real people, no brands.
- Reading level for age ${age}: short sentences, concrete words, gentle humour. Use repetition and the number three. Praise effort and noticing ("you tested it", "you noticed"), never "clever" or "smart".
- Exactly 4 chapters with these jobs, each with one small problem and a visible question the child wants answered:
  1. beat "ki": meet Pip and the question; the villain appears cheeky; the first obstacle.
  2. beat "sho": Pip travels on; the first choice has an obvious consequence.
  3. beat "ten": the twist or low point. The villain's trick reframes a clue, or an earlier choice bites back. It must refer back to what the child chose in chapters 1 or 2.
  4. beat "ketsu": Pip uses what was found. It must refer back to an earlier choice.
- Each chapter: setting (from: ${SETTING_KEYS.join(", ")}; vary them), time ("day" or "night"), narration of 2-4 short sentences (max 60 words), exactly 2 clues of DIFFERENT kinds, and exactly 3 choices.
- Clue kinds, with the fields each needs (plus "text": the true fact, one sentence, never the final answer):
  spot {"kind":"spot","label":"what to look at (max 5 words)","text":""}
  listen {"kind":"listen","sound":"a sound word, e.g. click... whirr","text":""}
  compare {"kind":"compare","question":"","a":"","b":"","answer":"a" or "b","text":""}
  ask {"kind":"ask","character":"owl"|"snail"|"mouse"|"robot","line":"what the helper says, one or two short sentences","text":""}
  test {"kind":"test","thing":"what Pip tests","settings":[{"label":"","result":""}, 2 or 3 of them],"text":""}
  pattern {"kind":"pattern","sequence":[3 or 4 short words],"options":[exactly 3 short words],"answer":"one of the options","text":""}
  Use at least 4 different kinds across the story, and make chapter 3 use a test or pattern clue.
- The 3 choices in each chapter are plausible, never labelled right or wrong in the text: one "wise", one "risky", one "silly". The wise choice uses the clues to reason or test. Risky is a fair try that half works. Silly is funny but kind. Nobody is shamed or hurt, and there is never a game over.
- Each choice has: text; quality; needs (an item id or null); acts (2 to 6 action steps that really SHOW what happens, so the animation matches the outcome); outcome (1-2 sentences saying what happened); reveals (one true sentence this consequence teaches; for a setback it teaches what did NOT work, which is still information); bridge (one sentence starting "Because of that," that opens the next chapter and mentions what the child did or what happened; in chapter 4 it leads into the ending); effects {"villain":-1|0|1,"hearts":-1|0|1,"gain":item id or null,"lose":item id or null}.
- Default effects: wise villain -1, hearts 0; risky villain 0; silly villain +1, hearts -1. Use hearts +1 sometimes for a great choice. A "gain" is something Pip finds or earns; a "lose" is something the villain grabs or Pip drops.
- Items: 2 or 3 backpack items, each {"id":"short_lowercase","name":"two words max","icon": one of ${ICON_IDS.join(", ")}}. At least one wise choice in chapter 1 or 2 must "gain" an item, and at least one choice in chapter 3 or 4 must have "needs" set to that item (the delayed consequence), so the child without it sees that choice locked. Never make all 3 choices in a chapter need an item. One silly choice may "lose" an item the child could have.
- Allowed action steps (use only these, as "verb" or "verb:argument"): walk:left, walk:middle, walk:obstacle, walk:villain, walk:right, jump, climb, slip, splash, hide, shine, think, cheer, dizzy, run_away, push, dig, fly, build, sleep, villain_laugh, villain_grow, villain_shrink, villain_steal, villain_trip, villain_flee, villain_sneak, rain, wind, dark, light, obstacle_break, obstacle_grow, item_appear, item_lost, rainbow, confetti. Examples: Pip hides the camera in a bush = ["walk:obstacle","hide","villain_laugh","obstacle_grow"]; a good test = ["walk:obstacle","think","item_appear","cheer"]. A choice that wins should include villain_shrink, villain_trip or cheer; one that backfires should include slip, splash, dizzy or villain_laugh.
- endings: three warm endings, none says "wrong". Each has title, narration (2-3 sentences) and acts (2 to 6 steps). "triumph" (the villain is outsmarted and joins in), "muddle" (Pip wins with a scrape and a laugh, and still has a question), "second_try" (Pip isn't finished yet but knows what to look at next; ends on "tomorrow we look again"). An ending may hint how the clues connect but must leave the final explanation for the child to say.
- wonder_prompt: one open question asking the child to explain the answer in their own words.
- offscreen_mission: one hands-on activity away from the screen, using everyday classroom or outdoor materials.
- villain.type from: fog, gremlin, machine, shadow. villain.color as a #rrggbb hex.
- facts_to_check: the true facts behind every clue and every "reveals" line, written plainly for the teacher to verify.
- If the question touches a sensitive subject (death, illness, family trouble, bodies, violence, danger), set needs_teacher true, write teacher_note with why, and keep the story very gentle. Otherwise needs_teacher false and teacher_note "".
- If the question is vague, silly or not quite a question, interpret it generously and kindly.

Reply with ONLY a JSON object of this shape:
{"title":"","form":"${form}","villain":{"name":"","type":"","color":"#","motive":""},"learning_aim":"","facts_to_check":[""],"materials":[""],"needs_teacher":false,"teacher_note":"",
"items":[{"id":"","name":"","icon":""}],
"chapters":[{"beat":"ki","setting":"","time":"day","narration":"","clues":[{"kind":"spot","label":"","text":""},{"kind":"compare","question":"","a":"","b":"","answer":"a","text":""}],
"choices":[{"text":"","quality":"wise","needs":null,"acts":["walk:obstacle","think","cheer"],"outcome":"","reveals":"","bridge":"Because of that, ","effects":{"villain":-1,"hearts":0,"gain":null,"lose":null}}]}],
"endings":{"triumph":{"title":"","narration":"","acts":[""]},"muddle":{"title":"","narration":"","acts":[""]},"second_try":{"title":"","narration":"","acts":[""]}},
"wonder_prompt":"","offscreen_mission":""}`;
}

const strOf = (v, d = "", max = 600) => (typeof v === "string" && v.trim() ? v.trim().slice(0, max) : d);
function cleanActs(a, fallback) {
  const out = (Array.isArray(a) ? a : []).map((x) => (typeof x === "string" ? x.trim() : "")).filter((x) => {
    const [v, arg] = x.split(":"); return VERBS.includes(v) && (v !== "walk" || WALKS.includes(arg));
  }).slice(0, 6);
  return out.length >= 2 ? out : fallback.slice();
}
function cleanClue(c) {
  if (!c || typeof c !== "object" || !KINDS.includes(c.kind)) return null;
  const text = strOf(c.text); if (!text) return null;
  const o = { kind: c.kind, text };
  switch (c.kind) {
    case "spot": o.label = strOf(c.label, "something shiny", 40); break;
    case "listen": o.sound = strOf(c.sound, "", 40); if (!o.sound) return null; break;
    case "compare":
      o.question = strOf(c.question, "Which one is it?", 160); o.a = strOf(c.a, "", 120); o.b = strOf(c.b, "", 120);
      if (!o.a || !o.b || !["a", "b"].includes(c.answer)) return null; o.answer = c.answer; break;
    case "ask": o.character = HELPER_IDS.includes(c.character) ? c.character : "owl"; o.line = strOf(c.line, "", 240); if (!o.line) return null; break;
    case "test": {
      o.thing = strOf(c.thing, "the mystery", 100);
      o.settings = (Array.isArray(c.settings) ? c.settings : []).slice(0, 3).map((x) => ({ label: strOf(x?.label, "", 80), result: strOf(x?.result, "", 160) })).filter((x) => x.label && x.result);
      if (o.settings.length < 2) return null; break;
    }
    case "pattern": {
      o.sequence = (Array.isArray(c.sequence) ? c.sequence : []).map((x) => strOf(x, "", 24)).filter(Boolean).slice(0, 4);
      let opts = (Array.isArray(c.options) ? c.options : []).map((x) => strOf(x, "", 24)).filter(Boolean).slice(0, 3);
      const ans = strOf(c.answer, "", 24);
      if (o.sequence.length < 3 || !ans) return null;
      if (!opts.includes(ans)) opts = [ans, ...opts.slice(0, 2)];
      o.options = opts; o.answer = ans; if (o.options.length < 2) return null; break;
    }
  }
  return o;
}
function validStory(s) {
  if (!s || typeof s !== "object" || !Array.isArray(s.chapters) || s.chapters.length < 4) return null;
  const v = s.villain || {}, ids = new Set();
  const items = (Array.isArray(s.items) ? s.items : []).slice(0, 4).map((it, i) => {
    let id = strOf(it?.id, "", 24).replace(/[^a-zA-Z0-9_]/g, ""); if (!id || ids.has(id)) id = "item" + i; ids.add(id);
    return { id, name: strOf(it?.name, "Mystery thing", 28), icon: ICON_IDS.includes(it?.icon) ? it.icon : ICON_IDS[i % ICON_IDS.length] };
  });
  const itemId = (x) => { const k = typeof x === "string" ? x.replace(/[^a-zA-Z0-9_]/g, "") : ""; return k && items.some((it) => it.id === k) ? k : null; };
  const gainable = new Set();
  const chapters = [];
  for (let ci = 0; ci < 4; ci++) {
    const ch = s.chapters[ci] || {};
    const clues = [];
    for (const c of Array.isArray(ch.clues) ? ch.clues : []) { const k = cleanClue(c); if (k) clues.push(k); }
    const picked = [];
    for (const k of clues) if (picked.length < 2 && !picked.some((p) => p.kind === k.kind)) picked.push(k);
    for (const k of clues) if (picked.length < 2 && !picked.includes(k)) picked.push(k);
    /* 2 or 3 usable choices; fall back kindly for missing outcome/reveals/bridge/effects */
    const raw = (Array.isArray(ch.choices) ? ch.choices : []).filter((c) => strOf(c?.text)).slice(0, 3);
    const choices = raw.map((c, i) => {
      const quality = QUALITIES.includes(c.quality) ? c.quality : QUALITIES[i];
      const e = c.effects || {}, d = DEFAULT_EFFECTS[quality];
      const num = (x, lo, hi, def) => (Number.isFinite(Number(x)) && x !== null && x !== "" ? clamp(Math.round(Number(x)), lo, hi) : def);
      const reveals0 = strOf(c.reveals, "", 300), outcome = strOf(c.outcome, "", 400) || reveals0 || "Pip tries it and sees what happens.";
      return { text: strOf(c.text, "", 200), quality, needs: null, _needs: itemId(c.needs),
        acts: cleanActs(c.acts, DEFAULT_ACTS[quality]), outcome, reveals: reveals0 || "Trying it showed Pip something new to think about.",
        bridge: strOf(c.bridge, "", 300),
        effects: { villain: num(e.villain, -1, 1, d.villain), hearts: num(e.hearts, -1, 1, d.hearts), gain: itemId(e.gain), lose: itemId(e.lose) } };
    });
    if (choices.length < 1) return null;
    /* a lock only counts if a WISE choice in an earlier chapter can hand the child that item; locks are never invented */
    choices.forEach((c) => { c.needs = c._needs && gainable.has(c._needs) ? c._needs : null; delete c._needs; });
    if (choices.every((c) => c.needs)) choices[choices.length - 1].needs = null;
    choices.forEach((c) => { if (c.quality === "wise" && c.effects.gain) gainable.add(c.effects.gain); });
    choices.forEach((c) => { if (!c.bridge) c.bridge = ci < 3 ? "Because of that, Pip walked on to the next place." : "Because of that, the story came to its end."; });
    chapters.push({ beat: BEATS[ci], setting: SETTING_KEYS.includes(ch.setting) ? ch.setting : "forest", time: ch.time === "night" ? "night" : "day", narration: strOf(ch.narration, "Pip looks around and wonders what to do next.", 700), clues: picked, choices });
  }
  const end = (k) => { const e = s.endings?.[k] || {}, d = DEFAULT_END[k]; return { title: strOf(e.title, d.title, 80), narration: strOf(e.narration, d.narration, 700), acts: cleanActs(e.acts, d.acts) }; };
  return {
    title: strOf(s.title, "Pip's Adventure", 100), form: strOf(s.form, "Quest", 40),
    villain: { name: strOf(v.name, "The Muddle", 40), type: ["fog", "gremlin", "machine", "shadow"].includes(v.type) ? v.type : "gremlin", color: HEX.test(v.color || "") ? v.color : "#8a5cc2", motive: strOf(v.motive, "", 200) },
    learning_aim: strOf(s.learning_aim, "", 300), facts_to_check: (Array.isArray(s.facts_to_check) ? s.facts_to_check : []).map((x) => strOf(x, "", 300)).filter(Boolean).slice(0, 12),
    materials: (Array.isArray(s.materials) ? s.materials : []).map((x) => strOf(x, "", 200)).filter(Boolean).slice(0, 8),
    needs_teacher: !!s.needs_teacher, teacher_note: strOf(s.teacher_note, "", 400),
    items, chapters, endings: { triumph: end("triumph"), muddle: end("muddle"), second_try: end("second_try") },
    wonder_prompt: strOf(s.wonder_prompt, "What do you think the answer is now?", 300), offscreen_mission: strOf(s.offscreen_mission, "", 400)
  };
}

const newGame = () => ({ ch: 0, power: 3, hearts: 3, items: [], picks: [], found: [], bridge: "", ending: null });

const KIND_LABEL = { spot: "Look closely", listen: "Listen", compare: "Compare", ask: "Ask a helper", test: "Test it", pattern: "Spot the pattern", consequence: "What happened" };

async function start(q, status) {
  if (!q) { status.textContent = "Type or say your question first."; $("#q").focus(); return; }
  state.question = q;
  if (!sampleFn) { status.textContent = "Live stories aren't available here. Try the sample adventure below."; return; }
  renderLoading();
  const ctl = new AbortController(); state.ctl = ctl;
  const form = FORMS[Math.floor(Math.random() * FORMS.length)];
  try {
    const raw = await sampleFn.json(buildPrompt(q, state.age, form), { signal: ctl.signal, modelTier: "default", cache: false });
    const story = validStory(raw);
    if (!story) throw { code: "bad_story" };
    story.question = q; state.story = story;
    renderCheck();
  } catch (e) {
    if (e?.code === "cancelled") { renderAsk(q); return; }
    renderAsk(q);
    const msg = { not_granted: "Pip needs permission to write stories. Allow it when Claude asks, then try again.", rate_limited: "Pip is out of breath. Wait a minute, then try again.", invalid_json: "Pip's story came out jumbled. Press Start to try again.", bad_story: "Pip's story came out jumbled. Press Start to try again." }[e?.code] || "Pip couldn't write the story just now. Press Start to try again.";
    $("#askStatus").textContent = msg;
  } finally { clearInterval(loadTimer); }
}

/* ---------- stage props for clues ---------- */
const slotBox = (slot) => { let b = $(`#bits .bit.s${slot}`); if (!b) { b = el("div", { class: `bit s${slot}` }); $("#bits").append(b); } return b; };
function addHotspot(slot, label, onTap) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", `translate(${slot ? 560 : 245} ${slot ? 235 : 250})`);
  g.setAttribute("role", "button"); g.setAttribute("tabindex", "0"); g.setAttribute("aria-label", "Look closely: " + label); g.setAttribute("data-hotspot", "spot"); g.style.cursor = "pointer";
  g.innerHTML = `<circle r="36" fill="transparent"/>${SPARK}`;
  const t = document.createElementNS(NS, "text");
  for (const [k, v] of Object.entries({ y: 48, "text-anchor": "middle", "font-size": 17, "font-family": "Fredoka, Trebuchet MS, sans-serif", "font-weight": 600, fill: "#26314f", stroke: "#fff", "stroke-width": 4, "paint-order": "stroke" })) t.setAttribute(k, v);
  t.textContent = label; g.append(t);
  g.addEventListener("click", onTap);
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onTap(); } });
  $("#hot", svg)?.append(g);
  return g;
}
function addHelper(slot, who) {
  const g = fxAt(slot ? 545 : 235, 402, `<ellipse cy="2" rx="34" ry="6" fill="#1b2340" opacity=".18"/><g class="bob" filter="url(#wcs)">${HELPERS[who] || HELPERS.owl}</g>`);
  g.parentNode.setAttribute("data-helper", who);
}
const clearProps = () => { $("#fx", svg)?.querySelectorAll("[data-helper]").forEach((n) => n.remove()); $("#hot", svg)?.replaceChildren(); clearBits(); };

/* ---------- one clue = one interaction ---------- */
function buildClue(clue, slot, onFound) {
  const card = el("div", { class: "cluecard", "data-kind": clue.kind, "data-state": "open" });
  const body = el("div", { class: "cardbody" });
  const fact = el("div", { class: "cardfact", hidden: true }, el("b", { text: "Clue" }), el("span", { text: clue.text }));
  card.append(el("div", { class: "cardhead" }, el("span", { class: "kindtag", text: KIND_LABEL[clue.kind] })), body, fact);
  let hot = null;
  const reveal = () => {
    if (card.dataset.state === "found") return;
    card.dataset.state = "found"; fact.hidden = false; hot?.remove(); animate("#pipInner", "hop");
    onFound(clue);
  };
  const live = (b) => { b.dataset.kind = clue.kind; return b; };
  const stage = () => slotBox(slot);
  switch (clue.kind) {
    case "spot": {
      hot = addHotspot(slot, clue.label, reveal);
      body.append(el("p", { class: "label", text: `Something to see: ${clue.label}.` }), live(el("button", { class: "btn small", type: "button", text: "Look closely", onclick: reveal })));
      break;
    }
    case "listen": {
      const b = live(el("button", { class: "btn small", type: "button", text: "Listen", onclick: async () => {
        b.disabled = true;
        const bub = el("div", { class: "bubble sound", "aria-hidden": "true" }, [...clue.sound].map((ch, i) => { const sp = el("span", { text: ch === " " ? " " : ch }); sp.style.animationDelay = `${i * 60}ms`; return sp; }));
        stage().append(bub);
        tts?.speak(clue.sound.replace(/\.\.\./g, ", "), { voice: "airy", rate: .8 }).catch(() => {});
        await (HASHFAST() ? sleep(30) : sleep(1700));
        reveal(); setTimeout(() => bub.remove(), 900);
      } }));
      body.append(el("p", { class: "label", text: "Press the button and listen to what Pip hears." }), b);
      break;
    }
    case "compare": {
      const tags = { a: el("div", { class: "tag" }, el("small", { text: "A" }), el("span", { text: clue.a })), b: el("div", { class: "tag" }, el("small", { text: "B" }), el("span", { text: clue.b })) };
      stage().append(tags.a, tags.b);
      const fb = el("p", { class: "said", role: "status" });
      const opts = el("div", { class: "opts" }, ["a", "b"].map((k) => live(el("button", { class: "opt", type: "button", "data-opt": k, onclick: (e) => {
        opts.querySelectorAll("button").forEach((x) => (x.disabled = true)); e.currentTarget.classList.add("picked");
        tags[clue.answer].classList.add("right");
        fb.textContent = k === clue.answer ? "You noticed it!" : `Good try. Look again at both: it was ${clue.answer.toUpperCase()}.`;
        reveal();
      } }, el("b", { text: k.toUpperCase() + ": " }), el("span", { text: clue[k] })))));
      body.append(el("p", { text: clue.question }), opts, fb);
      break;
    }
    case "ask": {
      addHelper(slot, clue.character);
      const bub = el("div", { class: "bubble" }, "…"); stage().append(bub);
      const b = live(el("button", { class: "btn small", type: "button", text: `Ask ${HELPER_NAME[clue.character]}`, onclick: () => {
        b.disabled = true; bub.textContent = clue.line; animate("#pipInner", "hop");
        body.append(el("p", { class: "said", text: `“${clue.line}”` }));
        tts?.speak(clue.line, { voice: "airy", rate: .92 }).catch(() => {});
        reveal();
      } }));
      body.append(el("p", { class: "label", text: `${HELPER_NAME[clue.character][0].toUpperCase()}${HELPER_NAME[clue.character].slice(1)} is waiting in the picture.` }), b);
      break;
    }
    case "test": {
      const tag = el("div", { class: "tag" }, el("small", { text: `Test: ${clue.thing}` }), el("span", { text: "Try a setting." })); stage().append(tag);
      const tried = new Set(), out = el("ul", { class: "pathlist", "aria-live": "polite" });
      const opts = el("div", { class: "opts" }, clue.settings.map((st, i) => live(el("button", { class: "opt", type: "button", "data-opt": String(i), text: st.label, onclick: (e) => {
        e.currentTarget.classList.add("picked");
        if (!tried.has(i)) { tried.add(i); out.append(el("li", { text: `${st.label}: ${st.result}` })); }
        tag.querySelector("span").textContent = st.result;
        if (tried.size >= 2) reveal();
      } }))));
      body.append(el("p", { text: `Test it: ${clue.thing}. Try at least two settings.` }), opts, out);
      break;
    }
    case "pattern": {
      const seq = [...clue.sequence.map((w) => el("span", { class: "tag seq", text: w })), el("span", { class: "tag seq", text: "?" })];
      stage().append(...seq);
      const fb = el("p", { class: "said", role: "status" });
      const opts = el("div", { class: "opts" }, clue.options.map((w) => live(el("button", { class: "opt", type: "button", "data-opt": w, onclick: (e) => {
        opts.querySelectorAll("button").forEach((x) => (x.disabled = true)); e.currentTarget.classList.add("picked");
        seq[seq.length - 1].textContent = clue.answer; seq[seq.length - 1].classList.add("right");
        fb.textContent = w === clue.answer ? "You spotted the pattern!" : `Good try. Look again: next comes “${clue.answer}”.`;
        reveal();
      } }, el("span", { text: w })))));
      body.append(el("div", { class: "seqrow", "aria-label": "Pattern" }, [...clue.sequence.map((w) => el("span", { text: w })), el("span", { text: "?" })]), el("p", { text: "What comes next?" }), opts, fb);
      break;
    }
  }
  return card;
}

/* ---------- a chapter ---------- */
function renderChapter() {
  stopPlayer(); setStep("play");
  const s = state.story, g = state.g, ch = s.chapters[g.ch], total = s.chapters.length;
  paint({ setting: ch.setting, night: ch.time === "night", pipX: -80, vilX: 670, villain: s.villain, power: g.power, obstacle: true, title: s.title });
  showHud(true); drawHud(); setCaption("");
  P.entrance = glide("pip", 90, 400, 900);

  const found = new Set();
  const hint = el("p", { class: "label", id: "hint", text: ch.clues.length ? "Find at least one clue to open Pip's choices. Tap a sparkle or a button." : "There are no clues to find here. Choose what Pip does." });
  const status = el("p", { class: "status", id: "playStatus" });
  const result = el("div", { id: "result" });
  const wrap = el("div", { class: "choices-wrap", hidden: ch.clues.length > 0 });
  const choicesBox = el("div", { class: "choices" });
  wrap.append(el("h2", { text: "What should Pip do?" }), choicesBox);
  const onFound = (clue) => {
    found.add(clue); g.found.push({ chapter: g.ch + 1, kind: clue.kind, text: clue.text });
    wrap.hidden = false;
    hint.textContent = found.size >= ch.clues.length ? "You found every clue here. Now choose what Pip does." : "Pip's choices are open. You can still look for the other clue first.";
  };
  const clueCards = ch.clues.map((c, i) => buildClue(c, i, onFound));

  shuffle(ch.choices).forEach((c, idx) => {
    const need = c.needs ? s.items.find((it) => it.id === c.needs) : null, locked = !!need && !g.items.includes(need.id);
    const b = el("button", { class: "choice", type: "button", "data-quality": c.quality, disabled: locked },
      el("span", { class: "k", text: "ABC"[idx] }),
      el("span", { class: "ctext" }, el("span", { text: c.text }),
        need ? el("span", { class: locked ? "need" : "need ok", text: locked ? `Needs the ${need.name.toLowerCase()}` : `Uses the ${need.name.toLowerCase()}` }) : null));
    if (locked) b.dataset.locked = "1";
    b.addEventListener("click", () => choose(c, b));
    choicesBox.append(b);
  });

  async function choose(c, btn) {
    choicesBox.querySelectorAll("button").forEach((x) => (x.disabled = true));
    btn.classList.add("chosen");
    clearProps();
    status.textContent = "Watch what Pip does…";
    const owned = (id) => (id && g.items.includes(id) ? id : null);
    const iconOf = (id) => s.items.find((it) => it.id === id)?.icon || null;
    const ctx = { villainName: s.villain.name, itemId: iconOf(c.effects.gain || c.needs || owned(c.effects.lose)), stealId: iconOf(owned(c.effects.lose)), packEmpty: !g.items.length };
    const ok = await play(c.acts, ctx);
    if (!ok) return;
    await applyEffects(c.effects);
    if (state.step !== "play" || state.g !== g || g.ch >= total) return;
    g.picks.push({ chapter: g.ch + 1, text: c.text, quality: c.quality, outcome: c.outcome });
    g.found.push({ chapter: g.ch + 1, kind: "consequence", text: c.reveals });
    g.bridge = c.bridge; status.textContent = "";
    const last = g.ch === total - 1;
    const next = el("button", { class: "btn teal", type: "button", text: last ? "See how it ends" : "Next chapter", onclick: () => { if (last) renderEnding(); else { g.ch++; renderChapter(); } } });
    result.replaceChildren(el("div", { class: "result", "data-quality": c.quality },
      el("p", { text: c.outcome }),
      el("div", { class: "clue consequence", "data-kind": "consequence" }, el("b", { text: "You found out" }), el("span", { text: c.reveals })),
      el("div", { class: "row" }, speakBtn(c.outcome + " " + c.reveals), next)));
    next.focus();
  }

  setPanel(
    el("div", { class: "eyebrow", text: `Chapter ${g.ch + 1} of ${total} · ${(SETTINGS[ch.setting] || SETTINGS.garden).name}${ch.time === "night" ? " at night" : ""}` }),
    g.bridge ? el("p", { class: "bridge", text: g.bridge }) : null,
    el("p", { class: "narration", text: ch.narration }),
    el("div", { class: "row" }, speakBtn(ch.narration)),
    clueCards.length ? el("div", { class: "cluegrid" }, clueCards) : null,
    hint, wrap, status, result
  );
}

/* ---------- endings ---------- */
function endingKey(power) { return power <= 1 ? "triumph" : power >= 4 ? "second_try" : "muddle"; }
function renderEnding() {
  stopPlayer(); setStep("play");
  const s = state.story, g = state.g, key = endingKey(g.power), e = s.endings[key];
  g.ending = key;
  const last = s.chapters[s.chapters.length - 1];
  paint({ setting: last.setting, pipX: 250, vilX: 600, villain: s.villain, power: g.power, friendly: key === "triumph", petals: key === "triumph", title: s.title });
  showHud(true); drawHud();
  panel.dataset.ending = key;
  const again = el("button", { class: key === "second_try" ? "btn teal" : "btn ghost", type: "button", text: "Try a different path", onclick: () => { state.tries++; state.g = newGame(); renderChapter(); } });
  const talk = el("button", { class: key === "second_try" ? "btn ghost" : "btn", type: "button", text: "Tell Pip what you think", onclick: renderReflect });
  setPanel(
    el("div", { class: "eyebrow", text: "The end of the adventure" }),
    el("h2", { text: e.title }),
    el("p", { class: "narration", text: e.narration }),
    key === "second_try" ? el("p", { class: "lead", text: "The same story is waiting. A different choice can change what happens, and Pip would love another go." }) : null,
    el("div", { class: "row" }, speakBtn(e.narration), key === "second_try" ? [again, talk] : [talk, again])
  );
  play(e.acts, { villainName: s.villain.name, itemId: null, stealId: null });
}

function renderReflect() {
  stopPlayer(); setStep("reflect"); showHud(false);
  const s = state.story;
  paint({ setting: "garden", pipX: 400, title: "Back at the Wonder Garden" });
  const ta = el("textarea", { id: "think", rows: "3", placeholder: "I think…", "aria-label": "What you think now" });
  ta.value = state.reflection;
  const pick = el("div", { class: "chips", role: "group", "aria-label": "Most interesting part" });
  const options = [...new Set(state.g.found.map((f) => f.text)), "Something else"];
  options.forEach((o) => pick.append(el("button", { class: "chip", type: "button", "aria-pressed": String(state.interest === o), text: o, onclick: (e) => {
    state.interest = o; pick.querySelectorAll("button").forEach((b) => { const on = b === e.currentTarget; b.setAttribute("aria-pressed", String(on)); b.style.background = on ? "var(--teal-soft)" : ""; b.style.borderColor = on ? "var(--teal)" : ""; });
  } })));

    el("div", { class: "eyebrow", text: "Your turn" }),

    el("p", { class: "lead", text: `You asked: “${state.question}”` }),

    el("p", { class: "label", text: "You noticed these clues. Which one was the most interesting?" }), pick,
    el("div", { class: "row" },
      el("button", { class: "btn", type: "button", text: "Make the family note", onclick: () => { state.reflection = ta.value.trim(); renderNote(); } }),
      el("button", { class: "btn ghost", type: "button", text: "Actually, that’s not what I was curious about", onclick: () => renderAsk(state.question + " ") }))

}

function renderNote() {
  stopPlayer(); setStep("note"); showHud(false);
  const s = state.story, g = state.g;
  paint({ setting: "garden", pipX: 400, vilX: 560, villain: s.villain, friendly: true, title: "Family note" });
  const kinds = [...new Set(g.found.map((f) => f.kind))].sort((a, b) => Object.keys(KIND_DID).indexOf(a) - Object.keys(KIND_DID).indexOf(b));
  const nClues = g.found.length;
  const explored = `They found ${plural(nClues, "clue")} by ${joinList(kinds.map((k) => KIND_DID[k]))}.${state.tries ? ` They tried a different path ${plural(state.tries, "time")}.` : ""}`;
  const pathLines = g.picks.map((p) => `Chapter ${p.chapter}: ${p.text} — ${p.outcome}`);
  const ending = g.ending ? s.endings[g.ending].title : "(not reached)";
  const obs = el("textarea", { id: "obs", rows: "2", placeholder: "What did you notice? e.g. tested each idea before choosing", "aria-label": "Teacher observation" });
  obs.value = state.teacherObs;
  const noteText = () => [
    `Wonder note`, `Question: ${state.question}`, `Adventure: ${s.title} (${s.form})`,

      el("dl", {},
        el("dt", { text: "Question" }), el("dd", { text: state.question }),
        el("dt", { text: "Adventure" }), el("dd", { text: `${s.title} (${s.form})` }),
        el("dt", { text: "Path taken" }), el("dd", {}, el("ol", { class: "pathlist", id: "pathList" }, pathLines.map((l) => el("li", { text: l })))),
        el("dt", { text: "How they explored" }), el("dd", { text: explored }),
        el("dt", { text: "How it ended" }), el("dd", { id: "endingLine", text: ending }),
        el("dt", { text: "In their own words" }), el("dd", { text: state.reflection || "Not recorded yet" }),
        el("dt", { text: "Most interesting" }), el("dd", { text: state.interest || "Not chosen" }),
        el("dt", { text: "Teacher noticed" }), el("dd", {}, obs),
        el("dt", { text: "Next step at home" }), el("dd", { text: s.offscreen_mission + " (optional)" }))),
    el("div", { class: "row" },
      el("button", { class: "btn teal", type: "button", text: "Copy note", onclick: async () => {
        state.teacherObs = obs.value;
        try { await navigator.clipboard.writeText(noteText()); copyStatus.textContent = "Copied."; } catch { copyStatus.textContent = "Copy didn't work here. Select the note text instead."; }
      } }),
      el("button", { class: "btn", type: "button", text: "Ask a new question", onclick: () => { state.question = ""; state.reflection = ""; state.interest = ""; state.teacherObs = ""; renderAsk(""); } }),
      el("button", { class: "link", type: "button", text: "Change my answer", onclick: renderReflect }),

}

renderAsk();
})();
